<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>PulseOS</title>
  <desc>PulseOS Gym Management Icon</desc>
  <defs>
    <linearGradient id="pulse-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="85%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="pulse-rim" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="node-glow" x="240" y="336" width="96" height="96" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#pulse-bg)" />

  <!-- Subtle Rim Light / Inner Border -->
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="url(#pulse-rim)" stroke-width="8" />

  <!-- Pulse Wave Line -->
  <path
    d="M96 272H176L224 128L288 384L352 208L384 272H416"
    stroke="#FFFFFF"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Energy Node -->
  <g filter="url(#node-glow)">
    <circle cx="288" cy="384" r="28" fill="#38BDF8" />
    <circle cx="288" cy="384" r="13" fill="#FFFFFF" />
  </g>
</svg>